            .loverain-viewer-loading__backdrop {
                position: absolute;
                inset: 0;

            .loverain-viewer-loading__spinner {

            .loverain-viewer-loading__sub {

                min-height: 1.35em;
                font-size: 0.88rem;
                color: rgba(255, 255, 255, 0.65);

            .loverain-viewer-loading__open {

            .loverain-viewer-loading--ready .loverain-viewer-loading__spinner {

        <script>
          const appDiv = document.getElementById('app');
          if (appDiv) {
            try {
              const pageData = JSON.parse(appDiv.getAttribute('data-page'));
              pageData.url = window.location.pathname + window.location.search;
              
              const client = pageData.props.client;
              const quote = pageData.props.quote;
              
              if (quote.message === "__" + "QUOTE_MESSAGE" + "__") quote.message = "Gửi lời yêu thương";
              if (quote.author === "__" + "QUOTE_AUTHOR" + "__") quote.author = "LoveRain";
              
              let title = pageData.props.title_raw;
              if (title === "__" + "TITLE" + "__") title = "Phạm Duy Nghĩa";
              
              if (client.color === "__" + "COLOR" + "__") client.color = "#EE66A6";
              if (client.music === "__" + "MUSIC" + "__" || !client.music) {
                 client.music = "musics/daobuochongkong.mp3";
                 client.type_music = "system";
              }
              if (client.messages === "__" + "MESSAGES" + "__" || !Array.isArray(client.messages) || client.messages.length === 0) {
                 client.messages = ["Anh yeu em"];
              }
              if (client.image === "__" + "IMAGES" + "__" || !Array.isArray(client.image) || client.image.length === 0) {
                 client.image = [
                    "./assets/images/1.jpg",
                    "./assets/images/2.jpg",
                    "./assets/images/3.jpg",
                    "./assets/images/4.jpg",
                    "./assets/images/5.jpg",
                    "./assets/images/6.jpg",
                    "./assets/images/7.jpg"
                 ];
              }
              
              let densityPercent = Number(client.particle_density);
              if (isNaN(densityPercent) || densityPercent <= 0) densityPercent = 100;
              window.__L_DENS = Math.max(1, Math.round(9 * (densityPercent / 100)));
              window.__L_DENS2 = Math.max(1, Math.round(18 * (densityPercent / 100)));
              
              let speedPercent = Number(client.particle_speed);
              if (isNaN(speedPercent) || speedPercent <= 0) speedPercent = 100;
              window.__L_SPEED = speedPercent / 100;
              
              client.messages = [title, ...client.messages];
              
              appDiv.setAttribute('data-page', JSON.stringify(pageData));
            } catch (e) {
              console.error("Lỗi parse data-page", e);
            }
          }

        <script>
            function resolveLoveRainAudioSrc(typeMusic, music) {
                if (typeMusic === "link" && music) {
                    return music;
                }
                if (typeMusic === "system" || !typeMusic) {
                    if (!music) {
                        return "./assets/musics/cochacyeuladay.mp3";
                    }
                    if (
                        music.startsWith("http://") ||
                        music.startsWith("https://") ||
                        music.startsWith("blob:")
                    ) {
                        return music;
                    }
                    if (music.startsWith("./assets/")) {
                        return music;
                    }
                    if (music.startsWith("musics/")) {
                        return "./assets/" + music;
                    }
                    return "./assets/musics/" + music.replace(/^\/+/, "");
                }
                return "./assets/musics/cochacyeuladay.mp3";
            }

            function getPageClientAudio() {
                const app = document.getElementById("app");
                if (!app) return null;
                try {
                    const page = JSON.parse(app.getAttribute("data-page"));
                    const c = page.props && page.props.client;
                    if (c && c.music) {
                        return {
                            type_music: c.type_music || "system",
                            music: c.music,
                        };
                    }
                } catch (e) {}
                return null;
            }

            function getActiveAudioConfig() {
                if (window.__LOVERAIN_PREVIEW_AUDIO__) {
                    return window.__LOVERAIN_PREVIEW_AUDIO__;
                }
                return (
                    getPageClientAudio() || {
                        type_music: "system",
                        music: "musics/daobuochongkong.mp3",
                    }
                );
            }

            function bindViewerAudio() {
                const audio = document.getElementById("audio-preview");
                const toggleBtn = document.getElementById("toggle-audio");
                const audioIcon = document.getElementById("audio-icon");
                if (
                    !audio ||
                    !toggleBtn ||
                    !audioIcon ||
                    audio.dataset.loverainBound === "1"
                )
                    return false;

                const isPreview =
                    new URLSearchParams(location.search).get("preview") === "1";
                const pathId = (location.pathname.match(
                    /\/([a-f0-9]{24})\/?$/i,
                ) || [])[1];
                const hasRecordId =
                    !!new URLSearchParams(location.search).get("id")?.trim() ||
                    !!pathId;
                if (
                    (isPreview || hasRecordId) &&
                    !window.__LOVERAIN_PREVIEW_AUDIO_READY__
                ) {
                    return false;
                }

                const cfg = getActiveAudioConfig();
                const type_music = cfg.type_music;
                const music = cfg.music;
                audio.dataset.loverainBound = "1";

                const updateAudioIcon = () => {
                    if (audio.muted || audio.paused) {
                        audioIcon.classList.remove("fa-volume-high");
                        audioIcon.classList.add("fa-volume-xmark");
                    } else {
                        audioIcon.classList.remove("fa-volume-xmark");
                        audioIcon.classList.add("fa-volume-high");
                    }
                };

                toggleBtn.addEventListener("click", () => {
                    if (audio.paused) {
                        audio
                            .play()
                            .then(() => {
                                audio.muted = false;
                            })
                            .catch(() => {
                                alert(
                                    "Không thể phát âm thanh. Có thể do trình duyệt chặn tự động phát.",
                                );
                            })
                            .finally(() => {
                                updateAudioIcon();
                            });
                    } else {
                        audio.muted = !audio.muted;
                        updateAudioIcon();
                    }
                });

                const tryPlay = () => {
                    if (audio.paused) {
                        audio
                            .play()
                            .then(() => {
                                audio.muted = false;
                            })
                            .catch(() => {})
                            .finally(() => {
                                updateAudioIcon();
                            });
                    } else {
                        updateAudioIcon();
                    }
                };

                audio.addEventListener("play", updateAudioIcon);
                audio.addEventListener("pause", updateAudioIcon);
                audio.addEventListener("volumechange", updateAudioIcon);

                audio.src = resolveLoveRainAudioSrc(type_music, music);
                audio.classList.remove("d-none");

                tryPlay();

                const oncePlay = () => {
                    tryPlay();
                    document.removeEventListener("click", oncePlay);
                };
                document.addEventListener("click", oncePlay);

                const onInteract = () => tryPlay();
                window.addEventListener("wheel", onInteract);
                window.addEventListener("mousedown", onInteract);
                window.addEventListener("mousemove", onInteract);
                window.addEventListener("touchstart", onInteract);
                return true;
            }

            document.addEventListener("DOMContentLoaded", function () {
                const waitForAudio = setInterval(() => {
                    if (bindViewerAudio()) {
                        clearInterval(waitForAudio);
                    }
                }, 200);

                window.addEventListener("loverain-preview-audio", () => {
                    const audio = document.getElementById("audio-preview");
                    if (!audio) return;
                    if (audio.dataset.loverainBound === "1") {
                        const cfg = getActiveAudioConfig();
                        audio.src = resolveLoveRainAudioSrc(
                            cfg.type_music,
                            cfg.music,
                        );
                        audio.load();
                        audio.play().catch(function () {});
                        return;
                    }
                    bindViewerAudio();
                });
            });

            (function () {
                function isPreviewDemo() {
                    if (
                        document.documentElement.dataset.loverainPreview === "1"
                    )
                        return true;
                    if (
                        document.documentElement.classList.contains(
                            "loverain-preview-demo",
                        )
                    )
                        return true;
                    return (
                        new URLSearchParams(location.search).get("preview") ===
                        "1"
                    );
                }

                function pinDemoWatermark() {
                    if (!isPreviewDemo()) return;
                    document.documentElement.classList.add(
                        "loverain-preview-demo",
                    );
                    document.documentElement.dataset.loverainPreview = "1";
                    var el = document.getElementById("loverain-demo-watermark");
                    if (!el) {
                        el = document.createElement("dialog");
                        el.id = "loverain-demo-watermark";
                        el.className = "loverain-demo-watermark";
                        el.setAttribute("aria-hidden", "true");
                        el.innerHTML =
                            '<div class="loverain-demo-watermark__grid" aria-hidden="true"></div>' +
                            '<span class="loverain-demo-watermark__text">Demo</span>';
                    }
                    if (!el.isConnected) {
                        document.body.appendChild(el);
                    }
                    if (!el.hasAttribute("open")) {
                        el.setAttribute("open", "");
                    }
                }

                window.__loverainPinDemoWatermark = pinDemoWatermark;
                pinDemoWatermark();
                document.addEventListener("DOMContentLoaded", pinDemoWatermark);
                window.addEventListener(
                    "loverain-preview-audio",
                    pinDemoWatermark,
                );
                if (isPreviewDemo()) {
                    setInterval(pinDemoWatermark, 800);
                }
            })();
        </script>
